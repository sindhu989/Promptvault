services:
  - type: web
    name: promptvault
    runtime: node
    plan: free
    buildCommand: npm ci --prefix backend --omit=dev && npm test --prefix backend && npm ci --prefix frontend --include=dev && npm run build --prefix frontend
    startCommand: npm --prefix backend start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
